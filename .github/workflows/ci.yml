name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check types
      run: npx tsc --noEmit

    - name: Run linter
      run: npm run lint

    - name: Build test
      run: npm run build
      env:
        # Dummy DB URL to pass build-time checks if any
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"

    - name: 🚀 Auto Push to Production
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        git config user.name "Deploy Bot"
        git config user.email "deploy@fernandocapital.web.id"
        git checkout -B production
        git push origin production --force
        echo "✅ Deployed to production"
