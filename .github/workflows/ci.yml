name: CI Validation Pipeline

on:
  push:
    branches: [ "main", "production" ]
  pull_request:
    branches: [ "main", "production" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Automated QA, Security, Compliance & Unit Test Gate
        run: npm run qa -- --static-only

      - name: Build production bundle
        run: npm run build
        env:
          # Offline placeholder URL for build-time static route generation only (never a real credential)
          DATABASE_URL: "postgresql://build_placeholder:build_placeholder@127.0.0.1:5432/build_placeholder"
